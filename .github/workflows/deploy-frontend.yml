# Builds and deploys the Next.js frontend (architecture plan Section D). Path-filtered so an
# agent/-only change doesn't redeploy this app.
#
# Required repo configuration before this can actually run (none of it exists yet -- this
# workflow is unvalidated against a real Azure subscription, see the plan's Section D note):
#   Secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (federated OIDC login --
#              see azure/login's "Use the Azure Login action with OpenID Connect" docs for how to
#              set up the federated credential; avoids storing a long-lived secret at all)
#   Variables: ACR_NAME, RESOURCE_GROUP, CONTAINER_APP_NAME_FRONTEND
name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push image
        run: |
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/ai-dev-workflow-frontend:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME_FRONTEND }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "$IMAGE"
