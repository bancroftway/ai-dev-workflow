# Manually-triggered wrapper around scripts/seed-config-vault.sh, the same script deploy.yml runs
# on every push. Use this one to seed a target out-of-band -- e.g. adding a newly-required secret
# to an environment that already deployed, without waiting for the next push -- see docs/CONFIG.md's
# "required for a real deployment" section, which is this script's own source of truth for what
# "required" means.
name: Seed Config Vault

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target / GitHub Environment name (e.g. nonprod, prod)'
        required: true
        type: string

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mandatory for OIDC azure/login
    environment: ${{ inputs.target }}
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: seed config vault (idempotent, additive only)
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          CONFIG_AUTH_SECRET: ${{ secrets.CONFIG_AUTH_SECRET }}
          CONFIG_AUTH_GITHUB_ID: ${{ secrets.CONFIG_AUTH_GITHUB_ID }}
          CONFIG_AUTH_GITHUB_SECRET: ${{ secrets.CONFIG_AUTH_GITHUB_SECRET }}
          CONFIG_AIDW_AGENT_CLIENT_SECRET: ${{ secrets.CONFIG_AIDW_AGENT_CLIENT_SECRET }}
          CONFIG_AIDW_AGENT_SHARED_SECRET: ${{ secrets.CONFIG_AIDW_AGENT_SHARED_SECRET }}
          CONFIG_ANTHROPIC_API_KEY: ${{ secrets.CONFIG_ANTHROPIC_API_KEY }}
          CONFIG_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CONFIG_CLAUDE_CODE_OAUTH_TOKEN }}
          CONFIG_GITHUB_TOKEN: ${{ secrets.CONFIG_GITHUB_TOKEN }}
        run: scripts/seed-config-vault.sh "${{ inputs.target }}"
