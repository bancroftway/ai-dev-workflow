# Build-once-deploy-everywhere (production CI/CD plan, Phase 3).
#
# dev  -> every target listed under "dev"  in .github/deploy-targets.json (home nonprod)
# main -> every target listed under "main" (home prod + every customer tenant, simultaneously)
#
# Images are built and Trivy-gated ONCE, pushed to private GHCR as :<sha> only, then imported into
# each target tenant's ACR -- identical bytes everywhere. The deploy itself is a single idempotent
# `az deployment group create` per target; infra drift and app rollout are one operation, and
# rollback is "re-run this workflow from the last good commit".
#
# Per-target GitHub Environment must define variables: AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID, RESOURCE_GROUP, ACR_NAME, NAME_PREFIX -- plus a federated credential on
# that tenant's deploy app registration with subject repo:<owner>/<repo>:environment:<target>.
#
# FIRST BOOTSTRAP of a new target is EXPECTED to go red at the smoke step: the deploy job seeds
# the config vault with REPLACE-ME placeholders (see "seed config vault" step below), but the apps
# still crash-loop until a human pastes real values over them (infra/README.md runbook). Fill in
# the vault, restart the apps, re-run this workflow -- every step is idempotent.
name: Deploy

on:
  push:
    branches: [dev, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Redundant with ci.yml's own gitleaks pass on every PR -- kept here too, same defense-in-depth
  # reasoning as the demo self-checks below: a commit that reached dev/main some other way than
  # the normal PR gate still gets full git-history secret scanning before any image is built.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # scripts/security-checks/*.sh are the single source of truth for every tool invocation here
      # -- a dev runs the identical script (identical docker image, identical flags) via
      # scripts/hooks/pre-commit before ever pushing, so nothing in this workflow can surprise them.
      - name: gitleaks
        run: scripts/security-checks/gitleaks.sh .

  build:
    needs: [secrets-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: frontend
            context: .
          - name: agent
            context: agent
          - name: sandbox
            context: agent/sandbox-image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Redundant with ci.yml's own agent job (same checks, same commit) -- kept here too as a
      # defense-in-depth gate in case dev/main ever gets a commit that skipped the PR check.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: matrix.name == 'agent'
      - run: uv sync --frozen
        if: matrix.name == 'agent'
        working-directory: agent
      - run: uv run python -m compileall -q src
        if: matrix.name == 'agent'
        working-directory: agent
      - name: demo self-checks
        if: matrix.name == 'agent'
        working-directory: agent
        run: |
          SKIP="db_migrate session_store project_store org_settings repo_auth_settings \
            repo_test_users repo_test_config run_event_store deploy_drain sessions_api \
            keyvault org_credential_vault github_link_store repo_scaffold chat_model \
            claude_chat_model copilot_chat_model cli_agent_exec telemetry graph \
            e2e_nodes fake_idp rebuild"
          fail=0
          for f in $(git ls-files 'src/*.py' 'src/gates/*.py'); do
            grep -q 'def _demo' "$f" || continue
            base=$(basename "$f" .py)
            case " $SKIP " in *" $base "*) continue ;; esac
            mod="${f%.py}"; mod="${mod//\//.}"
            echo "== $mod"
            timeout 120 uv run python -m "$mod" || { echo "FAIL $mod"; fail=1; }
          done
          exit $fail
      # Lints the Dockerfile source itself (before any build) -- best-practice/correctness issues
      # like uncached apt-get, missing pinned versions, ADD vs COPY.
      - name: hadolint
        run: scripts/security-checks/hadolint.sh "${{ matrix.context }}/Dockerfile"
      # sandbox is a multi-toolchain dev image (node, python, gh cli, claude code, ...) big enough
      # that the runner's ~14GB free disk runs out mid-build/scan without this; the preinstalled
      # toolcache (dotnet, android, ghc, codeql, powershell, various JVMs) is dead weight for a
      # docker-build-only job. This is the actual fix -- a `docker builder prune` after the build
      # was tried too, but a fresh runner has nothing stale to reclaim: every byte of that cache
      # still backs the one image we just built and haven't scanned/pushed yet, so it reclaimed 0B.
      - name: free disk space (sandbox only)
        if: matrix.name == 'sandbox'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/chromium /usr/lib/jvm
          df -h /
      - name: build image
        run: scripts/security-checks/build-image.sh "ghcr.io/${{ github.repository_owner }}/ai-dev-workflow-${{ matrix.name }}:${{ github.sha }}" "${{ matrix.context }}"
      # Lints the BUILT image against CIS/best-practice checks (non-root user, no baked secrets,
      # unnecessary setuid bits, ...) -- complements trivy's CVE scan with configuration hygiene.
      # dockle's own default timeout (1m30s) isn't enough for sandbox either -- same cause as
      # trivy's below, same TRIVY_TIMEOUT-style lookup for consistency.
      - name: dockle
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          source scripts/security-checks/versions.sh
          scripts/security-checks/dockle.sh \
            "ghcr.io/${{ github.repository_owner }}/ai-dev-workflow-${IMAGE_NAME}:${{ github.sha }}" \
            "${DOCKLE_TIMEOUT[$IMAGE_NAME]}"
      # Gate BEFORE push: a vulnerable or secret-carrying image never reaches any registry.
      # frontend/agent (what's actually exposed) block on LOW+ -- every fixable finding, no floor.
      # sandbox is a multi-toolchain dev image that chronically carries LOW/MEDIUM noise in some
      # transitive dependency; HIGH+ there is the agreed compromise, tighten via pinning findings
      # away rather than relaxing this further. ignore-unfixed (baked into the script) stays true
      # everywhere: blocking on a CVE with no available patch anywhere upstream is a gate nobody
      # can ever satisfy, not a security improvement.
      - name: trivy image scan
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          source scripts/security-checks/versions.sh
          IGNOREFILE=""
          [ -f "${{ matrix.context }}/.trivyignore" ] && IGNOREFILE="${{ matrix.context }}/.trivyignore"
          scripts/security-checks/trivy-image.sh \
            "ghcr.io/${{ github.repository_owner }}/ai-dev-workflow-${IMAGE_NAME}:${{ github.sha }}" \
            "${TRIVY_SEVERITY[$IMAGE_NAME]}" \
            "${TRIVY_TIMEOUT[$IMAGE_NAME]}" \
            "$IGNOREFILE"
          if [ "$IMAGE_NAME" = "sandbox" ]; then df -h /; fi
      - name: push to GHCR (private)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${{ github.repository_owner }}/ai-dev-workflow-${{ matrix.name }}:${{ github.sha }}"

  targets:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
      any: ${{ steps.read.outputs.any }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: read
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          LIST=$(jq -c --arg b "$BRANCH" '.[$b] // []' .github/deploy-targets.json)
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$LIST" != "[]" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [build, targets]
    if: needs.targets.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write # mandatory for OIDC azure/login
    strategy:
      fail-fast: false # one tenant failing must not stop the rest
      matrix:
        target: ${{ fromJson(needs.targets.outputs.list) }}
    environment: ${{ matrix.target }}
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # --force makes re-imports (workflow re-runs) idempotent. Guarded on the ACR already
      # existing: on a target's first-ever deploy the registry doesn't exist yet (only the bicep
      # step below creates it), so there's nothing to import into. That's expected -- see this
      # workflow's header comment on first-bootstrap -- and resolves itself once bicep has run
      # once; a later re-run of this same workflow imports normally. Same bytes in every tenant.
      - name: import images into target ACR
        run: |
          if az acr show --name "$ACR_NAME" >/dev/null 2>&1; then
            for n in frontend agent sandbox; do
              az acr import --name "$ACR_NAME" \
                --source "ghcr.io/${{ github.repository_owner }}/ai-dev-workflow-$n:$SHA" \
                --image "ai-dev-workflow-$n:$SHA" \
                --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" \
                --force
            done
          else
            echo "ACR $ACR_NAME does not exist yet (first bootstrap) -- skipping import, bicep will create it below; re-run this workflow afterward to import images"
          fi

      # The drain/grant/migrate steps below run the agent's own db helpers on the runner: they
      # need the MS ODBC driver (not in Ubuntu's default repos -- add Microsoft's) and uv.
      - name: prepare agent tooling
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc >/dev/null
          curl -sSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18
          pipx install uv
          cd agent && uv sync --frozen

      # Drain BEFORE the revision swap: the agent's LangGraph state is in-memory only, so the old
      # revision's in-flight sessions die with it. Draining first marks them failed while they are
      # still genuinely doomed; draining after the swap would wrongly kill healthy sessions started
      # on the NEW revision. Guarded on DB existence so a first bootstrap (no DB yet) skips it.
      - name: drain in-flight sessions
        run: |
          if az sql db show -g "$RESOURCE_GROUP" -s "$NAME_PREFIX-sql" -n "Ai-Dev-Workflow" >/dev/null 2>&1; then
            cd agent
            AZURE_SQL_SERVER="$NAME_PREFIX-sql.database.windows.net" \
            AZURE_SQL_DATABASE="Ai-Dev-Workflow" \
              uv run python -m src.deploy_drain --run
          else
            echo "no database yet (first bootstrap) -- skipping drain"
          fi

      - name: what-if (informational)
        run: |
          {
            echo '## what-if: ${{ matrix.target }}'
            echo '```'
            FRONTEND_IMAGE="$ACR_NAME.azurecr.io/ai-dev-workflow-frontend:$SHA" \
            AGENT_IMAGE="$ACR_NAME.azurecr.io/ai-dev-workflow-agent:$SHA" \
            SANDBOX_IMAGE_TAG="$SHA" \
              az deployment group what-if -g "$RESOURCE_GROUP" \
                --template-file infra/main.bicep \
                --parameters "infra/params/${{ matrix.target }}.bicepparam" \
                --no-pretty-print || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # First-ever deploy of a target is a chicken-and-egg: agentApp/frontendApp's SystemAssigned
      # identities don't exist until ARM creates them, but each container app can't finish
      # provisioning without already being able to pull its own image from the private ACR (its
      # AcrPull role assignment below is keyed off that same not-yet-existing identity) -- so the
      # real deploy just times out ("Operation expired") on a brand-new target, forever, and
      # AcrPull never gets the chance to be granted. A placeholder IMAGE alone doesn't dodge this:
      # verified live that Container Apps tries to resolve every registry listed in
      # `configuration.registries` whenever the resource is touched, regardless of which image the
      # current revision actually requests -- so the ACR 401 still fires even pulling a public
      # mcr.microsoft.com image, as long as the ACR is listed there at all. USE_ACR_REGISTRY=false
      # makes main.bicep omit the ACR from `registries` entirely for this one pass (see its own
      # useAcrRegistry param doc), which is what actually lets both container apps -- and their
      # AcrPull grants, unconditional below -- succeed. The unconditional real deploy right below
      # then defaults USE_ACR_REGISTRY back to true and pulls the private-ACR images, which now
      # succeed since AcrPull is already granted. Skipped once the agent app has ever produced a
      # revision -- from then on AcrPull is already granted and the deadlock can't recur.
      # Deliberately NOT just "does the container app resource exist": a target stuck in this exact
      # deadlock has a resource (provisioningState Failed) with latestRevisionName permanently
      # null, since it has never once pulled its image successfully -- an existence check alone
      # would see that stuck resource and wrongly skip bootstrapping forever.
      - name: bootstrap container apps (first deploy only)
        run: |
          LATEST_REVISION=$(az containerapp show -g "$RESOURCE_GROUP" -n "$NAME_PREFIX-agent" --query properties.latestRevisionName -o tsv 2>/dev/null || true)
          if [ -n "$LATEST_REVISION" ]; then
            echo "agent app already has a revision -- not a first deploy, nothing to bootstrap"
          else
            USE_ACR_REGISTRY=false \
            SANDBOX_IMAGE_TAG="$SHA" \
              az deployment group create -g "$RESOURCE_GROUP" \
                --name "bootstrap-$SHA" \
                --template-file infra/main.bicep \
                --parameters "infra/params/${{ matrix.target }}.bicepparam"
          fi

      - name: deploy (bicep, idempotent)
        run: |
          FRONTEND_IMAGE="$ACR_NAME.azurecr.io/ai-dev-workflow-frontend:$SHA" \
          AGENT_IMAGE="$ACR_NAME.azurecr.io/ai-dev-workflow-agent:$SHA" \
          SANDBOX_IMAGE_TAG="$SHA" \
            az deployment group create -g "$RESOURCE_GROUP" \
              --name "deploy-$SHA" \
              --template-file infra/main.bicep \
              --parameters "infra/params/${{ matrix.target }}.bicepparam"

      # Idempotent every deploy; same script .github/workflows/seed-config-vault.yml runs manually. Creates
      # a REPLACE-ME placeholder for any required secret (docs/CONFIG.md) with no CONFIG_<NAME>
      # GitHub secret set, so the config vault always has every expected name present -- open the
      # vault in the portal and paste real values over the placeholders. Never overwrites a value
      # (real or placeholder) already there.
      - name: seed config vault (placeholders)
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          CONFIG_AUTH_SECRET: ${{ secrets.CONFIG_AUTH_SECRET }}
          CONFIG_AUTH_GITHUB_ID: ${{ secrets.CONFIG_AUTH_GITHUB_ID }}
          CONFIG_AUTH_GITHUB_SECRET: ${{ secrets.CONFIG_AUTH_GITHUB_SECRET }}
          CONFIG_AIDW_AGENT_CLIENT_SECRET: ${{ secrets.CONFIG_AIDW_AGENT_CLIENT_SECRET }}
          CONFIG_AIDW_AGENT_SHARED_SECRET: ${{ secrets.CONFIG_AIDW_AGENT_SHARED_SECRET }}
          CONFIG_ANTHROPIC_API_KEY: ${{ secrets.CONFIG_ANTHROPIC_API_KEY }}
          CONFIG_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CONFIG_CLAUDE_CODE_OAUTH_TOKEN }}
          CONFIG_GITHUB_TOKEN: ${{ secrets.CONFIG_GITHUB_TOKEN }}
        run: scripts/seed-config-vault.sh "${{ matrix.target }}"

      # Idempotent every deploy; automates the one-time grant from infra/README.md. Runs as the
      # deploy SP, which is a member of the aidw-sql-admins group (the server's AAD admin).
      - name: grant agent identity on SQL
        run: |
          cd agent
          AZURE_SQL_SERVER="$NAME_PREFIX-sql.database.windows.net" \
          AZURE_SQL_DATABASE="Ai-Dev-Workflow" \
          AGENT_PRINCIPAL="$NAME_PREFIX-agent" \
            uv run python - <<'EOF'
          import os
          from src import db

          agent = os.environ["AGENT_PRINCIPAL"]
          sql = f"""
          IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = '{agent}')
            CREATE USER [{agent}] FROM EXTERNAL PROVIDER;
          IF IS_ROLEMEMBER('db_datareader', '{agent}') = 0
            ALTER ROLE db_datareader ADD MEMBER [{agent}];
          IF IS_ROLEMEMBER('db_datawriter', '{agent}') = 0
            ALTER ROLE db_datawriter ADD MEMBER [{agent}];
          """
          conn = db.connect()
          try:
              conn.cursor().execute(sql)
              conn.commit()
          finally:
              conn.close()
          print(f"grants ensured for [{agent}]")
          EOF

      - name: run DB migrations
        run: |
          cd agent
          AZURE_SQL_SERVER="$NAME_PREFIX-sql.database.windows.net" \
          AZURE_SQL_DATABASE="Ai-Dev-Workflow" \
            uv run python -m src.db_migrate

      # First bootstrap of a new target fails HERE until a human replaces the config vault's
      # REPLACE-ME placeholders with real values -- expected; see the header comment and
      # infra/README.md.
      - name: smoke
        run: |
          FRONTEND_URL=$(az deployment group show -g "$RESOURCE_GROUP" --name "deploy-$SHA" \
            --query properties.outputs.frontendUrl.value -o tsv)
          curl -sf --max-time 30 --retry 5 --retry-delay 10 --retry-all-errors "$FRONTEND_URL" >/dev/null
          STATUS=$(az containerapp revision list -g "$RESOURCE_GROUP" -n "$NAME_PREFIX-agent" \
            --query '[?properties.active].properties.healthState | [0]' -o tsv)
          echo "agent latest active revision health: $STATUS"
          [ "$STATUS" = "Healthy" ]
