# Builds and pushes the per-session sandbox image (architecture plan Section C) when its
# Dockerfile/entrypoint changes. This is the *fallback* image only (Decision 3's
# dotnet/npm/python/gh base) -- per-repo devcontainer.json-derived images are a separate,
# not-yet-built pipeline (plan Section C.3 risk #3).
#
# Required repo configuration: same OIDC login as deploy-agent.yml, plus the ACR_NAME variable.
name: Build Sandbox Image

on:
  push:
    branches: [main]
    paths:
      - "agent/sandbox-image/**"
      - ".github/workflows/build-sandbox-image.yml"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push image
        working-directory: agent/sandbox-image
        run: |
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/ai-dev-workflow-sandbox:${{ github.sha }}"
          LATEST="${{ vars.ACR_NAME }}.azurecr.io/ai-dev-workflow-sandbox:latest"
          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"
