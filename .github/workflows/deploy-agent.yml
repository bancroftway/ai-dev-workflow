# Builds and deploys the Python FastAPI/LangGraph agent (architecture plan Section D).
# Path-filtered to only agent/ changes.
#
# Required repo configuration before this can actually run (see deploy-frontend.yml's header for
# the same OIDC login setup):
#   Secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   Variables: ACR_NAME, RESOURCE_GROUP, CONTAINER_APP_NAME_AGENT
name: Deploy Agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "!agent/sandbox-image/**"
      - ".github/workflows/deploy-agent.yml"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push image
        working-directory: agent
        run: |
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/ai-dev-workflow-agent:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME_AGENT }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "$IMAGE"
