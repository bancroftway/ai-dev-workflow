# ======================================================================
# DO NOT MODIFY THIS FILE DURING FEATURE WORK
# aidw-template-version: 1
# ======================================================================
# (ASCII-only on purpose: mypy reads this file with the platform's locale codec, so the box-drawing
# characters the other templates use crash it outright on a non-UTF-8 locale -- observed as a
# UnicodeDecodeError on Windows cp1252, before it ever reached a single type check.)
# Written by ai-dev-workflow as this repo's shared type-safety baseline, and intentionally
# immutable during feature development -- the same policy as .NET's Directory.Build.props.
# Any modification requires:
#   1. A dedicated maintenance PR (not part of a feature branch)
#   2. Explicit justification in the PR description
#   3. A full lint + typecheck + test pass before merge
#
# Enforced as a build failure: the pipeline runs `mypy .`, whose non-zero exit is what makes an
# unsound annotation impossible to report as finished.
# ======================================================================

[mypy]
strict = True

# Missing stubs for third-party packages are a fact about *other people's* code -- erroring on them
# floods the report with findings this repo cannot act on and buries the real ones.
ignore_missing_imports = True

# Without this, `mypy .` walks the virtualenv, vendored trees and build output, which is both slow
# and full of foreign errors.
exclude = (?x)(
      ^\.venv/
    | ^venv/
    | ^node_modules/
    | ^build/
    | ^dist/
    | ^agent-work/
    | ^migrations/
  )

show_error_codes = True
