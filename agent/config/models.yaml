# Per-stage, per-role GitHub Copilot model selection (SPECIFICATION.md Section 3.4).
#
# `null` lets the Copilot SDK pick its own default model for that call.
# `audit_model` applies ONLY to the three stages with an adversarial audit pass
# (specification, plan, minimal-code-to-green) and should differ from draft_model -- the audit
# exists to get a second opinion from a *different* model. Other stages have no audit leg.
#
# Valid model ids depend on your GitHub Copilot account/plan -- list what's actually available
# with `CopilotClient.list_models()` (agent/.venv, `uv run python -c "..."`), not this comment,
# since the roster changes over time. As of this writing, this account has access to:
#   auto, claude-sonnet-5, claude-sonnet-4.6, claude-sonnet-4.5, claude-haiku-4.5,
#   claude-opus-5, gpt-5.6-terra, gpt-5.6-luna, gpt-5.4, gpt-5.3-codex, gpt-5.4-mini,
#   gpt-5-mini, mai-code-1-flash-picker, gemini-3.1-pro-preview, gemini-3.6-flash,
#   gemini-3.5-flash, kimi-k2.7-code
# Headless-test roster (2026-08-15, user directive): cheaper/faster models only, no
# claude-sonnet-5. Audits stay on a different vendor than their draft for a real second opinion.
tech-stack:
  # Also used for the "extract" role (Tech Stack tab's Submit-time JSON extraction) -- shares
  # draft_model, see model_config.get_model_name's own comment on why that's not a config gap.
  draft_model: gpt-5.4-mini
specification:
  draft_model: gpt-5.4-mini
  audit_model: gemini-3.6-flash
plan:
  draft_model: gpt-5.4-mini
  audit_model: gemini-3.6-flash
ac-to-tests:
  # gpt-5.3-codex: mini and plain gpt-5.4 both drafted structured metadata describing test files
  # without ever calling a file-write tool. Used via plain session_options (graph.py's StageSpec.
  # use_custom_agent=False for this stage) -- custom_agents was empirically confirmed to silently
  # drop part of its own declared tools:, so there is no agents/ac-to-tests-draft.md.
  draft_model: gpt-5.3-codex
minimal-code-to-green:
  # gpt-5.4 (not -mini) on purpose: the codegen stage's 70k+-token drafting turn is above the
  # mini tier's capability floor -- observed live twice, mini replied readiness=false in ~96
  # tokens rather than implement. Everything else stays on the cheap roster.
  draft_model: gpt-5.4
  audit_model: gemini-3.6-flash
brownfield-baseline:
  draft_model: gpt-5.4-mini
# Remediation FIX nodes are codegen-tier work -- mini fixed nothing across full cycles
# (observed live: 44-token replies leaving a complexity finding standing). Triage shares the
# stage model; acceptable, triage quality also improved.
test-hardening-flake-triage:
  draft_model: gpt-5.4-mini
metrics-report:
  draft_model: gpt-5.4-mini
rebuild:
  # Shared by every R placement (rebuild.py): both the GHCP build-VERIFICATION session and the
  # fix node. gpt-5.4 (not -mini): observed live, mini left trivial lint errors standing.
  draft_model: gpt-5.4
e2e:
  # e2e_fix_node (e2e_nodes.py) -- same codegen-tier reasoning as quality/security/rebuild's fix
  # nodes above: fixing a failing app or test is not mini-tier work.
  draft_model: gpt-5.4
# src/stack_runner.py sessions: a GHCP agent explores the repo, works out how to run a real
# toolchain command there, runs it, and reports through a schema-validated terminal tool. Exploring
# a generated monorepo and getting a build/test/coverage invocation right is the same class of work
# as the fix nodes above, not draft-tier -- mini-tier models guessed roots wrong.
stack-run:
  # Fallback for any stack_runner stage_key without its own entry below.
  draft_model: gpt-5.4
coverage-run:
  # gates/test_coverage_gate.py -- runs the tests with coverage, reports artifact paths.
  draft_model: gpt-5.4
ac-test-run:
  # gates/ac_coverage_gate.py -- runs the (expected-RED) suite and tees output for the AC-id scan.
  draft_model: gpt-5.4
remediation:
  # Previously carried by agents/remediation-draft.md's own `model:`; custom_agents is now off by
  # default (graph.py StageSpec.use_custom_agent), so every stage's roster lives here instead.
  draft_model: gpt-5.4
adversarial-compliance:
  draft_model: gpt-5.4
metrics-exit:
  draft_model: gpt-5.4-mini
session-title:
  # One short sentence in, one short phrase out -- the cheapest tier is plenty.
  draft_model: gpt-5.4-mini
